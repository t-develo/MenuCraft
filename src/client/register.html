<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>新規登録 - MenuCraft</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <main class="auth-page">
      <div class="auth-card">
        <h1>MenuCraft</h1>
        <h2>新規登録</h2>
        <form id="register-form">
          <div class="form-group">
            <label for="email">メールアドレス</label>
            <input type="email" id="email" name="email" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="password">パスワード</label>
            <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
          </div>
          <div class="form-group">
            <label for="confirm-password">パスワード（確認）</label>
            <input type="password" id="confirm-password" name="confirmPassword" required minlength="8" autocomplete="new-password">
          </div>
          <div id="register-error" class="error-message" hidden></div>
          <button type="submit" class="btn btn-primary">登録</button>
        </form>
        <p class="auth-link">
          既にアカウントをお持ちの方は<a href="/login.html">ログイン</a>
        </p>
      </div>
    </main>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api/apiFetch.js"></script>
  <script src="/js/api/auth.js"></script>
</body>
</html>
