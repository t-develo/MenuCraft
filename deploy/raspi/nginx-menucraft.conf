# MenuCraft — nginx site configuration (Raspberry Pi / LAN 内 HTTP)
#
# 静的フロントエンドを配信しつつ /api/ を同一オリジンでバックエンドへ中継する。
# 同一オリジンになるため CORS 設定（AllowedOrigins）は不要。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/menucraft;
    index index.html;

    # 検索エンジンに露出させない（API 側 SecurityHeadersMiddleware と同じ扱いを静的配信にも）
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # 家庭内 LAN の想定。レシピ本文や OGP 取得のレスポンスに備えて余裕を持たせる
    client_max_body_size 2m;

    # --- API: Azure Functions ホストへリバースプロキシ ---
    location /api/ {
        proxy_pass http://127.0.0.1:7071;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # OGP 取得は外部サイトへの HTTP アクセスを伴い、最大 10 秒かかる
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # API レスポンスはキャッシュさせない
        proxy_buffering off;
    }

    # Functions ホストの管理エンドポイント (/admin/*) は外部に晒さない
    location /admin/ {
        return 404;
    }

    # --- 静的ファイル ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # config.js は毎回取りに行かせる（API_BASE_URL 差し替えの反映漏れを防ぐ）
    location = /js/config.js {
        add_header Cache-Control "no-store" always;
    }

    error_page 404 /404.html;
}
