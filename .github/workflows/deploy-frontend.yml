name: Deploy Frontend (Storage Account)

on:
  push:
    branches:
      - main
    paths:
      - 'src/client/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Static Website

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Enable static website on Storage Account
        run: |
          az storage blob service-properties update \
            --account-name ${{ vars.STORAGE_ACCOUNT_NAME }} \
            --static-website \
            --index-document index.html \
            --404-document 404.html

      - name: Inject API_BASE_URL into config.js
        run: |
          sed -i "s|__API_BASE_URL__|${{ vars.API_BASE_URL }}|g" src/client/js/config.js

      - name: Upload to $web container
        run: |
          az storage blob upload-batch \
            --account-name ${{ vars.STORAGE_ACCOUNT_NAME }} \
            --source src/client \
            --destination '$web' \
            --overwrite
